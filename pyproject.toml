[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-tool"
version = "1.0.0-alpha"
description = "Time-Space Integrated Knowledge System - Capture knowledge in 0.5 seconds, organize on weekends, use for life"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Memory Tool Contributors", email = "noreply@example.com"}
]
keywords = ["knowledge-management", "timeline", "claude-code", "productivity", "pkm", "second-brain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",  # For beautiful CLI output
]

[project.urls]
Homepage = "https://github.com/hanyki111/memory_tool"
Repository = "https://github.com/hanyki111/memory_tool"
Issues = "https://github.com/hanyki111/memory_tool/issues"
Documentation = "https://github.com/hanyki111/memory_tool/blob/main/docs/USER_GUIDE.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]
vector = [
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]
llm = [
    "anthropic>=0.18.0",
    "ollama>=0.3.0",
]
tui = [
    "textual>=0.47.0",
]
completion = [
    "shtab>=1.6.0",
]

[project.scripts]
m = "memory_tool.cli:record_cli"
minit = "memory_tool.cli:init_cli"
ms = "memory_tool.cli:search_cli"
mcontext = "memory_tool.cli:context_cli"
mcheck = "memory_tool.cli:check_cli"
mtoday = "memory_tool.cli:today_cli"
mweek = "memory_tool.cli:week_cli"
mstatus = "memory_tool.cli:status_cli"
malias = "memory_tool.cli:alias_cli"
msummary = "memory_tool.cli:summary_cli"
mbrowse = "memory_tool.cli:browse_cli"
mcompletion = "memory_tool.cli:completion_cli"
mplan = "memory_tool.cli:plan_cli"
mtutorial = "memory_tool.cli:tutorial_cli"
mmap = "memory_tool.cli:map_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_tool*"]

[tool.setuptools.package-data]
memory_tool = ["py.typed", "templates/**/*"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
