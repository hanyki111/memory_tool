version: '1.0'
timeline:
  auto_record: false
  granularity: medium
  warn_old_days: 365
context:
  auto_update: true
  recent_days: 3
modules:
  auto_update_current: false
search:
  default_scope: local
  include_archived: false
  max_file_size: 10485760  # 10MB in bytes
  exclude_patterns:
    - "*.draft.md"
    - "archive/*"
    - ".templates/*"
llm:
  # Anthropic API key (or set ANTHROPIC_API_KEY environment variable)
  api_key: null
  # Model to use for summarization
  model: "claude-3-5-sonnet-20241022"
  # Maximum tokens in response
  max_tokens: 4096
  # Temperature for generation (0.0-1.0)
  temperature: 0.7
