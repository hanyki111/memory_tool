version: "1.0"
timeline:
  auto_record: false
  granularity: medium
  warn_old_days: 365
context:
  auto_update: true
  recent_days: 3
modules:
  auto_update_current: false
  # Archive settings
  archive_keep_recent: 10   # Default number of recent decisions to keep
  # File size warnings (marchive command)
  warn_size_decisions: 500  # lines
  warn_size_current: 300    # lines
  warn_on_record: true      # Show warnings on m command
  warn_on_status: true      # Show warnings on mstatus command
search:
  default_scope: local
  include_archived: false
  max_file_size: 10485760 # 10MB in bytes
  exclude_patterns:
    - "*.draft.md"
    - "archive/*"
    - ".templates/*"
llm:
  # LLM provider: 'anthropic' (cloud, API key) or 'ollama' (local, free)
  provider: ollama

  # Ollama settings (local LLM)
  ollama_host: http://localhost:11434
  ollama_model: qwen3-vl:8b

  # Anthropic settings (cloud API)
  anthropic_api_key: null # or set ANTHROPIC_API_KEY environment variable
  anthropic_model: claude-3-5-sonnet-20241022

  # Common settings
  max_tokens: 4096
  temperature: 0.7

  # Output language for summaries: 'ko' (Korean), 'en' (English), 'auto' (detect from content)
  output_language: ko

  # Custom categories for timeline/module summaries (optional)
  # If not set, uses default categories
  custom_categories:
    - Phase Implementation
    - Feature Development
    - Bug Fixes
    - Refactoring
    - Architecture Decisions
    - Testing & Documentation

  # Maximum context tokens to inject into prompts (avoids exceeding LLM limits)
  max_context_tokens: 2000

  # Backwards compatibility (will use anthropic_* if provider is anthropic)
  api_key: null
  model: null
